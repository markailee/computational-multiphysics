<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">非正交扩散修正</title>
  <desc id="desc">相邻单元中心连线与界面法向不一致，面积矢量分解为正交主项E和非正交修正H</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267da7"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bf5656"/></marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ce8029"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203040}.formula{font-size:22px}.note{font-size:18px;fill:#526779}</style>
  </defs>
  <rect width="1200" height="570" fill="#fbfcfe"/>
  <text x="600" y="43" text-anchor="middle" font-size="27" font-weight="700">非正交界面：紧凑主项 + 显式修正</text>
  <polygon points="90,160 445,95 535,370 180,455" fill="#e8f2fa" stroke="#567b95" stroke-width="3"/>
  <polygon points="445,95 835,165 910,425 535,370" fill="#eef6ef" stroke="#648671" stroke-width="3"/>
  <line x1="445" y1="95" x2="535" y2="370" stroke="#267da7" stroke-width="6"/>
  <circle cx="305" cy="275" r="9" fill="#bf5656"/><circle cx="690" cy="260" r="9" fill="#bf5656"/>
  <text x="280" y="310" font-size="25" font-weight="700">P</text><text x="710" y="295" font-size="25" font-weight="700">N</text>
  <circle cx="490" cy="232" r="7" fill="#267da7"/>
  <text x="470" y="216" text-anchor="end" font-size="20" fill="#267da7">界面 f</text>
  <line x1="305" y1="275" x2="690" y2="260" stroke="#bf5656" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#arrowR)"/>
  <text x="505" y="298" text-anchor="middle" font-size="21" fill="#bf5656">dPN = xN − xP</text>
  <line x1="490" y1="232" x2="566" y2="120" stroke="#267da7" stroke-width="4" marker-end="url(#arrowB)"/>
  <text x="574" y="115" font-size="21" fill="#267da7">nf</text>
  <path d="M519 230A43 43 0 0 0 523 203" fill="none" stroke="#8b6aa7" stroke-width="3"/>
  <text x="541" y="221" font-size="20" fill="#8b6aa7">θf</text>
  <line x1="490" y1="232" x2="530" y2="173" stroke="#ce8029" stroke-width="4" marker-end="url(#arrowO)"/>
  <line x1="530" y1="173" x2="566" y2="120" stroke="#8b6aa7" stroke-width="4" marker-end="url(#arrowO)"/>
  <text x="466" y="170" text-anchor="end" font-size="20" fill="#ce8029">Ef（隐式）</text>
  <text x="600" y="157" font-size="20" fill="#8b6aa7">Hf（显式）</text>
  <rect x="910" y="95" width="255" height="200" rx="16" fill="#f4f0f8" stroke="#8b6aa7" stroke-width="2"/>
  <text x="1037" y="135" text-anchor="middle" font-size="22" font-weight="700">几何关系</text>
  <text x="1037" y="176" text-anchor="middle" class="formula">Af = Ef + Hf</text>
  <text x="1037" y="216" text-anchor="middle" class="formula">ef = dPN / dPN</text>
  <text x="1037" y="260" text-anchor="middle" class="note">θf = 0：正交，Hf = 0</text>
  <rect x="80" y="475" width="495" height="65" rx="14" fill="#fff2df" stroke="#ce8029" stroke-width="2"/>
  <text x="327" y="504" text-anchor="middle" font-size="20" font-weight="700">正交主项：φN − φP</text>
  <text x="327" y="529" text-anchor="middle" class="note">进入 aP 和 aNB，保持紧凑稳定模板</text>
  <rect x="625" y="475" width="495" height="65" rx="14" fill="#f2ecfa" stroke="#8b6aa7" stroke-width="2"/>
  <text x="872" y="504" text-anchor="middle" font-size="20" font-weight="700">非正交修正：(∇φ)f · Hf</text>
  <text x="872" y="529" text-anchor="middle" class="note">使用已知梯度，进入右端并等待外迭代收敛</text>
</svg>
