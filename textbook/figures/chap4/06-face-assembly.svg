<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">界面守恒组装</title>
  <desc id="desc">内部界面的通量只计算一次，以相反符号累加到属主单元P和相邻单元N的方程</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287fad"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203040}.mono{font-family:Consolas,monospace;font-size:20px}.note{font-size:18px;fill:#526779}</style>
  </defs>
  <rect width="1200" height="590" fill="#fbfcfe"/>
  <text x="600" y="44" text-anchor="middle" font-size="27" font-weight="700">内部界面：一次计算，双端更新</text>
  <rect x="75" y="105" width="420" height="240" rx="18" fill="#e8f2fa" stroke="#4d7895" stroke-width="3"/>
  <rect x="705" y="105" width="420" height="240" rx="18" fill="#edf6ef" stroke="#608571" stroke-width="3"/>
  <text x="285" y="145" text-anchor="middle" font-size="25" font-weight="700">属主单元 P（owner）</text>
  <text x="915" y="145" text-anchor="middle" font-size="25" font-weight="700">相邻单元 N（neighbour）</text>
  <text x="285" y="190" text-anchor="middle" font-size="21">观察到的外向流量：+Ff</text>
  <text x="915" y="190" text-anchor="middle" font-size="21">观察到的外向流量：−Ff</text>
  <text x="285" y="235" text-anchor="middle" class="mono">A[P,P] += Df + max(Ff,0)</text>
  <text x="285" y="272" text-anchor="middle" class="mono">A[P,N] −= Df + max(−Ff,0)</text>
  <text x="915" y="235" text-anchor="middle" class="mono">A[N,N] += Df + max(−Ff,0)</text>
  <text x="915" y="272" text-anchor="middle" class="mono">A[N,P] −= Df + max(Ff,0)</text>
  <text x="285" y="318" text-anchor="middle" class="note">右端加入 +Jf*</text>
  <text x="915" y="318" text-anchor="middle" class="note">右端加入 −Jf*</text>
  <line x1="495" y1="105" x2="495" y2="345" stroke="#287fad" stroke-width="5"/>
  <line x1="495" y1="105" x2="705" y2="105" stroke="#287fad" stroke-width="5"/>
  <line x1="495" y1="345" x2="705" y2="345" stroke="#287fad" stroke-width="5"/>
  <circle cx="600" cy="225" r="58" fill="#fff" stroke="#287fad" stroke-width="3"/>
  <text x="600" y="216" text-anchor="middle" font-size="24" font-weight="700" fill="#287fad">界面 f</text>
  <text x="600" y="246" text-anchor="middle" font-size="18" fill="#287fad">计算 Ff、Df</text>
  <line x1="540" y1="160" x2="660" y2="160" stroke="#287fad" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="160" y="405" width="880" height="65" rx="16" fill="#203f58"/>
  <text x="600" y="445" text-anchor="middle" font-size="23" style="fill:#ffffff">Jf,P→N + Jf,N→P = 0</text>
  <text x="600" y="515" text-anchor="middle" font-size="20" fill="#526779">内部界面不贡献全局净源项；全场求和后只剩边界通量、存储项和物理源项</text>
  <text x="600" y="553" text-anchor="middle" font-size="18" fill="#7a5d36">注意：延迟修正通量也必须成对加入，不能分别在两个单元中独立计算</text>
</svg>
